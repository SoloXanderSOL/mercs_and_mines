name: Release

# GAP-32: CI runs on every push to dev and every pull request, not only on main. The
# deploy job's main-only guard below is what keeps those runs off production.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # sqlx::query! is a COMPILE-TIME macro: it normally connects to a live database to
  # validate SQL against the real schema. Runners have no database, so verification
  # comes from the committed .sqlx/ cache instead — compile-time checking stays fully
  # intact, it just reads the schema from an artifact rather than a connection.
  # sqlx 0.8 auto-detects the cache when DATABASE_URL is absent; being explicit means
  # CI can never silently attempt a connection and fail obscurely.
  # Regenerate with `cargo sqlx prepare --workspace -- --all-targets` whenever a query
  # or migration changes, or the build fails here rather than at runtime.
  # The `-- --all-targets` is load-bearing: without it the command still exits 0 but
  # writes a smaller cache that omits every macro used from a test target, and the
  # build then fails in CI (red run #58).
  SQLX_OFFLINE: true

jobs:
  build:
    name: Build
    # Pinned to the droplet's Ubuntu release (24.04): the binary built here runs there,
    # and a newer image can link a newer glibc than the host has (GAP-47). Move this pin,
    # the deploy job's pin and the cache key together whenever the droplet is upgraded.
    runs-on: ubuntu-24.04
    # Versions deliberately match production (Postgres 16, Redis 7): a CI database on a
    # different major version tests the wrong thing. No migration step is needed — the
    # harness runs sqlx::migrate!("../../migrations") against the pool itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mercs
          POSTGRES_PASSWORD: mercs
          POSTGRES_DB: mercs_test
        ports:
          - 5432:5432
        # The health checks are not optional. Without them the test step can start
        # before Postgres accepts connections, producing an intermittent failure that
        # looks exactly like a code bug.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ubuntu-24.04-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ubuntu-24.04-cargo-

      - name: Run tests
        # --workspace covers every crate; --test-threads=1 is mandatory because the
        # shared-database integration tests reuse wallet addresses behind
        # ON DELETE RESTRICT constraints and collide with FK-23503 in parallel.
        #
        # --nocapture is load-bearing for the GAP-26 guard below. libtest captures the
        # stdout/stderr of PASSING tests and discards it, so the "TEST_..._URL not set"
        # messages a self-skipping test prints never reach the log without it. Verified:
        # with a database absent and no --nocapture, `grep -c 'not set'` returns 0 even
        # though all 26 database tests skipped themselves. Do not remove this flag
        # without also removing the guard step, or the guard silently passes forever.
        env:
          TEST_DATABASE_URL: postgres://mercs:mercs@localhost:5432/mercs_test
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          set -o pipefail
          cargo test --workspace --locked -- --test-threads=1 --nocapture 2>&1 | tee test-output.txt

      - name: Fail if any integration test skipped itself
        # GAP-26: these tests return early when their env var is absent, which cargo
        # reports as a pass. A green run is therefore not evidence they executed.
        # This step is the evidence. Do not delete it.
        run: |
          if grep -qE 'TEST_(DATABASE|REDIS)_URL not set' test-output.txt; then
            echo "::error::Integration tests skipped themselves — Postgres or Redis is not reaching the test process."
            grep -E 'TEST_(DATABASE|REDIS)_URL not set' test-output.txt
            exit 1
          fi
          echo "No self-skips: the database and Redis suites executed."

      - name: Build release binary
        # --locked enforces Cargo.lock exactly — required for build determinism.
        # The simulation output must be identical across every build of the same commit.
        # MERCS_BUILD_SHA is embedded by option_env! and served at /api/version; the
        # deploy script polls it to prove the new build is the one serving. A changed
        # value is a tracked env-dep, so a cached target/ still rebuilds.
        env:
          MERCS_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked

      - name: Upload server binary
        uses: actions/upload-artifact@v6
        with:
          name: mercs-server
          path: target/release/mercs-server
          if-no-files-found: error

      - name: Upload app directory
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: app/
          if-no-files-found: error

  deploy-script:
    name: Deploy script harness
    # GAP-33: proves every branch of deploy/remote_deploy.sh's exit-code contract (0/1/2)
    # against PATH shims, on every push and PR. No services and no toolchain: it runs in
    # seconds, in parallel with build, and the deploy job needs it green.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: shellcheck is present
        # The runner image lists shellcheck; this step fails loudly if that ever changes,
        # instead of the lint step below passing by not running.
        run: shellcheck --version

      - name: Lint deploy scripts
        run: shellcheck deploy/remote_deploy.sh deploy/test_remote_deploy.sh

      - name: Run deploy harness
        run: bash deploy/test_remote_deploy.sh

  audit:
    name: Dependency audit
    # INF-6a: fails on any RustSec advisory, unsound crate or yanked crate not ignored in
    # .cargo/audit.toml, on every push and PR; the deploy job needs it green. The advisory
    # DB is fetched live, so this job can go red with no code change. The escape hatch is a
    # dated ignore entry (ID + reason + re-check date) in the same commit as the fix.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The binary is cached under its pinned version: a clean install takes minutes.
      # Bump the version here and in the install step together.
      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-ubuntu-24.04-cargo-audit-0.22.2

      - name: Install cargo-audit
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Run cargo audit
        run: cargo audit

  deploy:
    name: Deploy to DigitalOcean
    needs: [build, deploy-script, audit]
    # This workflow also runs on dev pushes, pull requests and workflow_dispatch. Without
    # this condition, any of those would ship a non-main build to the production droplet.
    # Deploy is main-only, full stop.
    if: github.ref == 'refs/heads/main'
    # Pinned with the build job for consistency (GAP-47); this job only runs scp/ssh/rsync.
    runs-on: ubuntu-24.04
    # Secrets reach steps only through env:, never interpolated into a run: body.
    env:
      DEPLOY_USER: ${{ secrets.DEV_SERVER_USER }}
      DEPLOY_HOST: ${{ secrets.DEV_SERVER_HOST }}
      APP_PATH: ${{ secrets.DEV_SERVER_APP_PATH }}
    steps:
      - name: Checkout
        # For deploy/remote_deploy.sh, which is streamed to the droplet below.
        uses: actions/checkout@v5

      - name: Download server binary
        uses: actions/download-artifact@v7
        with:
          name: mercs-server

      - name: Download app directory
        uses: actions/download-artifact@v7
        with:
          name: app
          path: app/

      - name: Configure SSH agent
        env:
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.DEV_SERVER_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID"  >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PASSPHRASE" | ssh-add ~/.ssh/deploy_key

      - name: Upload binary to server
        run: |
          scp mercs-server "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH/mercs-server.new"

      # --exclude='_dev/' keeps app/_dev/ (base_demo.html and any future scratch pages)
      # off the public host. nginx also denies /_dev/ — belt and braces, both are canon.
      # app/ goes up before the restart (as it always has); a rollback restores the
      # binary only, not app/ (GAP-54).
      - name: Upload app directory to server
        run: |
          rsync -a --delete --exclude='_dev/' \
            app/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH/app/"

      # Backup, swap, restart, SHA probe and rollback are one droplet-side script, tested
      # by the deploy-script job. It exits 0 (deployed), 1 (failed, rollback verified) or
      # 2 (rollback failed or impossible); any non-zero fails this step. The probe polls
      # /api/version until build_sha == this commit, on loopback (the binary binds
      # 127.0.0.1:3000; Security_Mandate.md 2i). The 60s budget covers a first boot
      # against a fresh database, which runs every migration before binding.
      - name: Deploy, verify build SHA, roll back on failure
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_PATH='$APP_PATH' EXPECTED_SHA='$EXPECTED_SHA' bash -s" < deploy/remote_deploy.sh


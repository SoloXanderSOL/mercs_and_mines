name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # sqlx::query! is a COMPILE-TIME macro: it normally connects to a live database to
  # validate SQL against the real schema. Runners have no database, so verification
  # comes from the committed .sqlx/ cache instead — compile-time checking stays fully
  # intact, it just reads the schema from an artifact rather than a connection.
  # sqlx 0.8 auto-detects the cache when DATABASE_URL is absent; being explicit means
  # CI can never silently attempt a connection and fail obscurely.
  # Regenerate with `cargo sqlx prepare --workspace -- --all-targets` whenever a query
  # or migration changes, or the build fails here rather than at runtime.
  # The `-- --all-targets` is load-bearing: without it the command still exits 0 but
  # writes a 44-file cache that omits every macro used from a test target, and the
  # build then fails in CI (red run #58). The correct command produces 49 files.
  SQLX_OFFLINE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Versions deliberately match production (Postgres 16, Redis 7): a CI database on a
    # different major version tests the wrong thing. No migration step is needed — the
    # harness runs sqlx::migrate!("../../migrations") against the pool itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mercs
          POSTGRES_PASSWORD: mercs
          POSTGRES_DB: mercs_test
        ports:
          - 5432:5432
        # The health checks are not optional. Without them the test step can start
        # before Postgres accepts connections, producing an intermittent failure that
        # looks exactly like a code bug.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        # --workspace covers every crate; --test-threads=1 is mandatory because the
        # shared-database integration tests reuse wallet addresses behind
        # ON DELETE RESTRICT constraints and collide with FK-23503 in parallel.
        #
        # --nocapture is load-bearing for the GAP-26 guard below. libtest captures the
        # stdout/stderr of PASSING tests and discards it, so the "TEST_..._URL not set"
        # messages a self-skipping test prints never reach the log without it. Verified:
        # with a database absent and no --nocapture, `grep -c 'not set'` returns 0 even
        # though all 26 database tests skipped themselves. Do not remove this flag
        # without also removing the guard step, or the guard silently passes forever.
        env:
          TEST_DATABASE_URL: postgres://mercs:mercs@localhost:5432/mercs_test
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          set -o pipefail
          cargo test --workspace --locked -- --test-threads=1 --nocapture 2>&1 | tee test-output.txt

      - name: Fail if any integration test skipped itself
        # GAP-26: these tests return early when their env var is absent, which cargo
        # reports as a pass. A green run is therefore not evidence they executed.
        # This step is the evidence. Do not delete it.
        run: |
          if grep -qE 'TEST_(DATABASE|REDIS)_URL not set' test-output.txt; then
            echo "::error::Integration tests skipped themselves — Postgres or Redis is not reaching the test process."
            grep -E 'TEST_(DATABASE|REDIS)_URL not set' test-output.txt
            exit 1
          fi
          echo "No self-skips: the database and Redis suites executed."

      - name: Build release binary
        # --locked enforces Cargo.lock exactly — required for build determinism.
        # The simulation output must be identical across every build of the same commit.
        run: cargo build --release --locked

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: mercs-server
          path: target/release/mercs-server
          if-no-files-found: error

      - name: Upload app directory
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/
          if-no-files-found: error

  deploy:
    name: Deploy to DigitalOcean
    needs: build
    # This workflow also accepts workflow_dispatch. Without this condition, manually
    # dispatching it from ANY branch builds that branch and ships it to the production
    # droplet. Deploy is main-only, full stop.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: mercs-server

      - name: Download app directory
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app/

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEV_SERVER_HOST }}" >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID"  >> "$GITHUB_ENV"
          printf '%s\n' "${{ secrets.DEV_SERVER_SSH_PASSPHRASE }}" | ssh-add ~/.ssh/deploy_key

      - name: Upload binary to server
        run: |
          scp \
            mercs-server \
            "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}:${{ secrets.DEV_SERVER_APP_PATH }}/mercs-server.new"

      # Preserve the last-known-good binary BEFORE the swap destroys it. Without this
      # there is nothing to roll back to when the health check below fails.
      - name: Back up current binary
        env:
          APP_PATH: ${{ secrets.DEV_SERVER_APP_PATH }}
        run: |
          ssh "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}" \
            "APP_PATH='$APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -f "$APP_PATH/mercs-server.prev"
          if [ -f "$APP_PATH/mercs-server" ]; then
            cp -a "$APP_PATH/mercs-server" "$APP_PATH/mercs-server.prev"
            echo "Backed up current binary -> mercs-server.prev"
          else
            echo "No existing binary (first deploy) — nothing to back up."
          fi
          REMOTE

      - name: Atomic swap and set permissions
        run: |
          ssh "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}" \
            "mv ${{ secrets.DEV_SERVER_APP_PATH }}/mercs-server.new \
                ${{ secrets.DEV_SERVER_APP_PATH }}/mercs-server \
             && chmod +x ${{ secrets.DEV_SERVER_APP_PATH }}/mercs-server"

      # --exclude='_dev/' keeps app/_dev/ (base_demo.html and any future scratch pages)
      # off the public host. nginx also denies /_dev/ — belt and braces, both are canon.
      - name: Upload app directory to server
        run: |
          rsync -a --delete --exclude='_dev/' \
            app/ \
            "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}:${{ secrets.DEV_SERVER_APP_PATH }}/app/"

      # Restart, then prove the new binary actually serves before declaring victory.
      # `systemctl restart` returns success the moment the process forks, so it is not
      # evidence of anything on its own. Restart and health check are one remote script
      # so that a restart failure funnels into the same rollback path.
      #
      # Probe is loopback: the binary binds 127.0.0.1:3000 and is not publicly
      # reachable (Security_Mandate.md 2i). /api/units is unauthenticated and stateless,
      # but main.rs connects Postgres and Redis and runs migrations BEFORE binding —
      # so any 200 proves the whole startup path, not just that a process exists.
      # 60s budget: a first boot against a fresh database also runs 15 migrations.
      - name: Restart, health check, and roll back on failure
        env:
          APP_PATH: ${{ secrets.DEV_SERVER_APP_PATH }}
        run: |
          ssh "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}" \
            "APP_PATH='$APP_PATH' bash -s" <<'REMOTE'
          set -uo pipefail

          HEALTH_URL='http://127.0.0.1:3000/api/units'
          TIMEOUT_SECS=60

          sudo systemctl reset-failed mercs-and-mines || true
          if ! sudo systemctl restart mercs-and-mines; then
            echo "systemctl restart returned non-zero — falling through to the health check."
          fi

          echo "Polling $HEALTH_URL for up to ${TIMEOUT_SECS}s..."
          deadline=$(( SECONDS + TIMEOUT_SECS ))
          while ! curl -sf --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::DEPLOY FAILED — $HEALTH_URL did not respond within ${TIMEOUT_SECS}s."
              echo "----- last 50 journal lines -----"
              sudo journalctl -u mercs-and-mines -n 50 --no-pager || true
              echo "---------------------------------"

              if [ -f "$APP_PATH/mercs-server.prev" ]; then
                echo "Restoring mercs-server.prev..."
                mv "$APP_PATH/mercs-server.prev" "$APP_PATH/mercs-server"
                chmod +x "$APP_PATH/mercs-server"
                sudo systemctl reset-failed mercs-and-mines || true
                sudo systemctl restart mercs-and-mines || true
                echo "::error::ROLLED BACK to the previous binary. Verify the service by hand before deploying again."
              else
                echo "::error::No mercs-server.prev exists (first deploy) — NO ROLLBACK POSSIBLE. The service is down."
              fi
              exit 1
            fi
            sleep 2
          done

          echo "Health check passed — new binary is serving."
          rm -f "$APP_PATH/mercs-server.prev"
          REMOTE

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Mercs &amp; Mines: Seeker Demo</title>
  <meta name="description" content="Sign in with your Seeker and meet your Commander.">
  <link rel="icon" type="image/png" href="assets/favicon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="play/play.css">
</head>
<body>
  <main class="stage" id="stage">

    <section id="screen-title" class="screen screen-title" hidden>
      <img class="title-logo" src="assets/MM_title.png" alt="Mercs &amp; Mines">
      <p class="title-tagline" id="title-tagline"></p>
      <button class="btn btn-primary" id="btn-start" type="button"></button>
    </section>

    <section id="screen-signin" class="screen screen-signin" hidden>
      <p class="explainer" id="signin-explainer"></p>
      <p class="explainer" id="signin-lna"></p>
      <button class="btn btn-primary" id="btn-signin" type="button"></button>
      <p class="status" id="signin-status" role="status" aria-live="polite"></p>
    </section>

    <section id="screen-genesis" class="screen screen-genesis" hidden>
      <p class="genesis-badge" id="genesis-badge" hidden></p>
      <h1 class="genesis-title" id="genesis-title"></h1>
      <p class="genesis-body" id="genesis-body"></p>
      <button class="btn btn-primary" id="btn-genesis-continue" type="button"></button>
    </section>

    <section id="screen-working" class="screen screen-working" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="status" id="working-text" role="status" aria-live="polite"></p>
    </section>

    <section id="screen-reveal" class="screen screen-reveal" hidden>
      <p class="reveal-note" id="reveal-note" role="status" hidden></p>
      <div class="reveal-content" id="reveal-content"></div>
      <button class="btn btn-primary btn-continue" id="btn-continue" type="button">Continue</button>
    </section>

    <section id="screen-hub" class="screen screen-hub" hidden>
      <header class="hub-top"><h1 class="hub-title" id="hub-title"></h1></header>
      <canvas class="hub-map" id="hub-map"></canvas>
      <div class="legend" id="legend" hidden>
        <ul class="legend-list" id="legend-list"></ul>
      </div>
      <nav class="hub-bottom">
        <button class="btn btn-bar" id="btn-back" type="button"></button>
        <button class="btn btn-bar btn-bar-primary" id="btn-missions" type="button"></button>
        <button class="btn btn-bar" id="btn-recentre" type="button"></button>
        <button class="btn btn-bar" id="btn-legend" type="button" aria-expanded="false"></button>
      </nav>
    </section>

    <section id="screen-missions" class="screen screen-missions" hidden>
      <h1 class="screen-heading" id="missions-title"></h1>
      <ul class="missions-list" id="missions-list"></ul>
      <button class="btn" id="btn-missions-back" type="button"></button>
    </section>

    <section id="screen-briefing" class="screen screen-briefing" hidden>
      <img class="still" id="briefing-still" alt="">
      <h1 class="screen-heading" id="briefing-name"></h1>
      <p class="briefing-text" id="briefing-text"></p>
      <p class="briefing-line" id="briefing-squad"></p>
      <p class="briefing-line" id="briefing-commander"></p>
      <div class="briefing-actions" id="briefing-actions">
        <button class="btn btn-primary" id="btn-deploy" type="button"></button>
        <button class="btn" id="btn-briefing-back" type="button"></button>
      </div>
    </section>

    <section id="screen-battle" class="screen screen-battle" hidden>
      <img class="still" id="battle-still" alt="">
      <ul class="score-lines" id="battle-lines"></ul>
      <p class="battle-reveal battle-chance" id="battle-chance"></p>
      <p class="battle-reveal battle-roll" id="battle-roll"></p>
      <p class="battle-reveal battle-outcome" id="battle-outcome"></p>
      <button class="btn" id="btn-skip" type="button"></button>
    </section>

    <section id="screen-aar" class="screen screen-aar" hidden>
      <img class="still still-short" id="aar-still" alt="">
      <h1 class="screen-heading" id="aar-title"></h1>
      <p class="aar-outcome" id="aar-outcome"></p>
      <div class="aar-panel">
        <h2 class="panel-heading" id="aar-units-heading"></h2>
        <ul class="aar-units" id="aar-units"></ul>
      </div>
      <div class="aar-row">
        <div class="aar-box">
          <h2 class="panel-heading" id="aar-pay-heading"></h2>
          <div id="aar-pay"></div>
        </div>
        <div class="aar-box aar-commander" id="aar-commander"></div>
      </div>
      <button class="btn btn-primary" id="btn-aar-continue" type="button"></button>
    </section>

    <section id="screen-end" class="screen screen-end" hidden>
      <h1 class="end-title" id="end-title"></h1>
      <p class="end-name" id="end-name"></p>
      <p class="end-grade" id="end-grade"></p>
      <p class="end-flaw" id="end-flaw"></p>
      <p class="end-body" id="end-body"></p>
      <p class="end-glorious" id="end-glorious" hidden></p>
      <button class="btn btn-primary" id="btn-new-run" type="button"></button>
    </section>

    <section id="screen-checkout" class="screen screen-checkout" hidden>
      <h1 class="checkout-title" id="checkout-title"></h1>
      <div class="spinner" id="checkout-spinner" aria-hidden="true" hidden></div>
      <p class="checkout-line" id="checkout-line" role="status" aria-live="polite" hidden></p>
      <p class="checkout-body" id="checkout-body" hidden></p>
      <div class="checkout-actions">
        <button class="btn btn-primary" id="btn-checkout-primary" type="button" hidden></button>
        <button class="btn" id="btn-checkout-secondary" type="button" hidden></button>
      </div>
    </section>

    <section id="screen-error" class="screen screen-error" hidden>
      <p class="error-text" id="error-text" role="alert"></p>
      <button class="btn btn-primary" id="btn-error-retry" type="button">Retry</button>
    </section>

    <button id="btn-mute" type="button" class="mute-btn" aria-pressed="false"></button>
    <footer class="debug" id="debug" hidden></footer>
  </main>

  <script type="module" src="play/main.js"></script>
</body>
</html>
